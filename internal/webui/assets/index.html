<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="apple-mobile-web-app-title" content="Boiler Mate">
  <title>Boiler Mate</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/flame.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script src="/controller-reads.js" defer></script>
  <script src="/external-heating.js" defer></script>
  <script src="/pellets.js" defer></script>
  <script src="/degree-weather.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="flex items-center gap-3 md:block">
        <a class="brand" href="#overview">
          <img class="brand-icon" src="/flame.svg" alt="" width="32" height="32"><span>Boiler Mate</span>
        </a>
        <select id="mobile-navigation" class="mobile-navigation" aria-label="Open a dashboard page"></select>
      </div>
      <nav id="navigation" aria-label="Boiler navigation"></nav>
      <div class="sidebar-footer"><span class="indicator" id="sidebar-indicator"></span><span id="sidebar-status">Connecting…</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><strong id="breadcrumb">Overview</strong></div>
        <div class="top-status"><span id="serial" class="serial"></span><span id="access" class="pill"></span></div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title">Confirm change</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions"><button value="cancel" class="secondary" autofocus>Cancel</button><button value="confirm" class="primary" id="confirm-action">Apply</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
