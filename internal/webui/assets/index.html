<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Boiler Mate</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="flex items-center gap-3 md:block">
      <a class="brand" href="#overview">
        <span class="brand-icon" aria-hidden="true">BM</span><span>Boiler Mate</span>
      </a>
        <select id="mobile-navigation" class="mobile-navigation" aria-label="Open a dashboard page"></select>
      </div>
      <nav id="navigation" aria-label="Boiler navigation"></nav>
      <div class="sidebar-footer"><span class="indicator" id="sidebar-indicator"></span><span id="sidebar-status">Connecting…</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><strong id="breadcrumb">Overview</strong></div>
        <div class="top-status"><span id="serial" class="serial"></span><span id="access" class="pill"></span></div>
      </header>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title">Confirm change</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions"><button value="cancel" class="secondary" autofocus>Cancel</button><button value="confirm" class="primary" id="confirm-action">Apply</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
