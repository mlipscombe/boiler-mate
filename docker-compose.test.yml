services:
  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "boiler-mate/test-health", "-q", "1", "-m", "ready"]
      interval: 2s
      timeout: 3s
      retries: 10
